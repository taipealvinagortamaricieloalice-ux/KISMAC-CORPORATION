<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KISMAC · Prototipos estáticos y dinámicos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#f4f6f2;--fg:#1c2418;--card:#fff;--bd:#cfd6c8;--g:#2f6b1f;--gt:#fff;--mut:#5d6857;--red:#c62828;--amb:#e68a00;--blu:#1f5fbf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141912;--fg:#e8eee3;--card:#1e251b;--bd:#3a4535;--g:#5fa347;--gt:#10200a;--mut:#9aa693;--red:#ef6b6b;--amb:#f0a63a;--blu:#6aa3f5}}
:root[data-theme="dark"]{--bg:#141912;--fg:#e8eee3;--card:#1e251b;--bd:#3a4535;--g:#5fa347;--gt:#10200a;--mut:#9aa693;--red:#ef6b6b;--amb:#f0a63a;--blu:#6aa3f5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 12px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--fg);padding:7px 14px;cursor:pointer;font:inherit}
.seg button.on{background:var(--g);color:var(--gt);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--g);color:var(--gt);border-color:var(--g)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.box.st{border-style:dashed}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;margin-bottom:8px}
.id{font-weight:700;color:var(--g)}
.rf{font-size:12px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{border:1px solid var(--bd);border-radius:8px;padding:10px}
.k b{font-size:26px;display:block}
.k.al{border-color:var(--red)}.k.al b{color:var(--red)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.Pendiente,.Solicitada,.Verificación{background:var(--amb)}.Confección,.Aprobada{background:var(--blu)}
.Terminado,.Validado,.Recibida,.OK{background:#2e8b2e}.Entregado{background:#333}.Crítico,.Rechazado{background:var(--red)}
.btn{border:0;background:var(--g);color:var(--gt);padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
.btn.o{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.btn.r{background:var(--red);color:#fff}
.btn:disabled,select:disabled,input:disabled{opacity:.55;cursor:not-allowed}
.alert{border:1px solid var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);border-radius:8px;padding:10px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.frm{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
select,input{padding:6px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit}
.bars div.r{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bars .l{width:120px}.bars .t{flex:1;background:var(--bg);border-radius:4px;height:16px}.bars .f{height:16px;border-radius:4px;background:var(--g)}
.bars .f.c{background:var(--red)}
.note{font-size:12px;color:var(--mut);margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
.wf,.wf *{font-family:"Balsamiq Sans","Comic Sans MS",cursive}
.chrome{border:2px solid #444;border-radius:10px 10px 0 0;background:#e9e9e9;color:#222;margin-top:6px}
.chrome .tabn{background:#cfcfcf;display:inline-block;padding:4px 14px;font-size:12px;border-radius:8px 8px 0 0;margin:6px 0 0 10px}
.chrome .url{display:flex;gap:10px;align-items:center;padding:6px 10px;background:#d9d9d9;font-size:13px}
.chrome .u{flex:1;border:2px solid #555;border-radius:99px;background:#fff;padding:2px 12px}
.chrome .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:#f3f3f3;border-top:2px solid #444}
.chrome .lg{background:#1f4d14;color:#fff;font-weight:700;padding:6px 10px;border-radius:4px;letter-spacing:1px}
.chrome .sal{background:#777;color:#fff;padding:4px 14px;border-radius:5px}
.chrome .mn{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:#f3f3f3;border-top:1px solid #bbb}
.chrome .mn span{border:2px solid #666;border-radius:6px;padding:3px 10px;font-size:12px;background:#fff}
.chrome .mn span.on{background:#2a6fdb;border-color:#2a6fdb;color:#fff}
.box.wf{border:2px solid #444;border-top:0;border-radius:0 0 10px 10px;margin-bottom:10px;color:#222;background:#fff}
.box.wf .btn{background:#2a6fdb;color:#fff}
.box.wf .btn.r{background:#d33}
.box.wf th,.box.wf .rf,.box.wf .note{color:#555}
.box.wf .id{color:#1f4d14}
.box.wf .k,.box.wf td,.box.wf th{border-color:#999}
.chrome .mn span{cursor:pointer}
.lgi{height:60px;width:auto;border-radius:8px;border:2px solid #c9a24a;display:block}
.chrome.mod{border:0;background:transparent;margin-top:6px}
.chrome.mod .tabn,.chrome.mod .url{display:none}
.chrome.mod .hd{background:linear-gradient(135deg,#0d3b1c,#2f6b1f);color:#fff;border:0;border-radius:12px 12px 0 0;border-bottom:3px solid #c9a24a;padding:10px 16px}
.chrome.mod .sal{background:#c9a24a;color:#1a1a1a;font-weight:600}
.chrome.mod .mn{background:var(--card);border:1px solid var(--bd);border-top:0}
.chrome.mod .mn span{border:0;background:transparent;color:var(--fg);font-weight:600}
.chrome.mod .mn span.on{background:var(--g);color:var(--gt)}
.box.mod{border-radius:0 0 12px 12px;border-top:0;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px;border-radius:12px;background:linear-gradient(120deg,#0d3b1c,#2f6b1f 60%,#c9a24a);color:#fff;margin-bottom:12px}
.hero h2{margin:0;font-size:20px}.hero p{margin:2px 0 0;opacity:.9}
.hero p::first-letter{text-transform:uppercase}
.hb{margin-left:auto;display:flex;gap:8px}.hero .btn{background:#c9a24a;color:#1a1a1a}.hero .btn.o{background:transparent;color:#fff;border:1px solid #fff9}
.kp{color:#fff;border-radius:12px;padding:12px}.kp span{font-size:22px}.kp b{display:block;font-size:30px;line-height:1.1}.kp small{opacity:.95}
.gr2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.li>div:not(.sw){flex:1}
.gm{display:block}.li .gm{width:44px;height:44px;flex:none;background:var(--bg);border-radius:10px;padding:4px}
.sw{width:44px;height:44px;border-radius:10px;flex:none;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 3px,transparent 3px 7px)}
.ttl{font-weight:700;margin:12px 0 4px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pc{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}
.pc .im{background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--g) 20%,var(--bg)));padding:14px}.pc .im .gm{width:92px;height:92px;margin:auto}.pc .in{padding:10px}
.pb{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--g)}.pb i.c{background:var(--red)}
.oc{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.oc .gm{width:50px;height:50px;flex:none}.oc .inf{flex:1;min-width:180px}.rc{width:70px;height:93px;flex:none}
.stp{display:flex;align-items:center;margin-top:6px}.stp i{width:14px;height:14px;border-radius:50%;background:var(--bd)}.stp u{width:28px;height:3px;background:var(--bd)}.stp i.d,.stp u.d{background:var(--g)}
.av{width:46px;height:46px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
</style>
</head>

function lb(e){return LBL[e]||e}
function dis(){return mode==='st'?' disabled':''}
function crit(m){return m.q<m.min}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},2400)}
function pago(id){return S.pag.filter(function(x){return x.p===id})[0]}

function kOf(t){return /Pijama|quir/i.test(t)?'med':/Uniforme/i.test(t)?'esc':/Mameluco/i.test(t)?'mam':/chef/i.test(t)?'chef':'dep'}
var KC={med:'#1aa6b7',esc:'#1f4fa3',mam:'#e67e22',chef:'#f5f5f5',dep:'#c62828'};
function G(k){var c=KC[k],T='M18 12L6 22l6 10 6-4v28h28V28l6 4 6-10-12-10Q32 20 18 12Z',o='';
 if(k==='mam')o='<path d="M20 8L10 16l4 10 6-4v14l-4 22h13l3-16 3 16h13l-4-22V22l6 4 4-10-10-8Q32 16 20 8Z" fill="'+c+'"/><path d="M32 16v26" stroke="#0003" stroke-width="2"/><rect x="24" y="24" width="6" height="5" fill="#0002"/><path d="M20 30h24" stroke="#fff8" stroke-width="2"/>';
 else{o='<path d="'+T+'" fill="'+c+'"/>';
  if(k==='med')o+='<path d="M26 13l6 12 6-12" fill="#fff"/><rect x="36" y="38" width="7" height="8" rx="1" fill="#0002"/>';
  if(k==='chef')o+='<path d="M32 18v38" stroke="#0003" stroke-width="2"/><circle cx="27" cy="28" r="2" fill="#555"/><circle cx="27" cy="38" r="2" fill="#555"/><circle cx="27" cy="48" r="2" fill="#555"/><circle cx="37" cy="28" r="2" fill="#555"/><circle cx="37" cy="38" r="2" fill="#555"/><circle cx="37" cy="48" r="2" fill="#555"/>';
  if(k==='esc')o+='<path d="M24 12l8 12 8-12z" fill="#fff"/><path d="M30 24h4l2 20-4 4-4-4z" fill="#c62828"/>';
  if(k==='dep')o+='<path d="M6 22l6 10M58 22l-6 10" stroke="#fff" stroke-width="3"/><text x="32" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">10</text>';}
 return '<svg viewBox="0 0 64 64" class="gm" stroke="#0002">'+o+'</svg>'}
function R(m,op){return '<svg viewBox="0 0 90 120" class="rc"><rect x="2" y="2" width="86" height="116" rx="10" fill="#fff" stroke="#bbb"/><rect x="2" y="2" width="86" height="30" rx="10" fill="#742284"/><text x="45" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Yape</text><text x="45" y="52" text-anchor="middle" font-size="9" fill="#2e8b2e">✔ Pago exitoso</text><text x="45" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#222">S/ '+m+'</text><text x="45" y="100" text-anchor="middle" font-size="8" fill="#777">Op. '+op+'</text></svg>'}
var SWC={'T-001':'#6b7b4a','T-002':'#3d4a6b','H-001':'#eeeeee','A-001':'#c9a24a','A-002':'#8a8a8a'};
function sw(c){return '<div class="sw" style="background-color:'+(SWC[c]||'#999')+'"></div>'}
function stp(e){var a=['Pendiente','Confección','Terminado','Entregado'],i=a.indexOf(e);return '<div class="stp">'+a.map(function(s,j){return (j?'<u class="'+(j<=i?'d':'')+'"></u>':'')+'<i class="'+(j<=i?'d':'')+'" title="'+lb(s)+'"></i>'}).join('')+'</div>'}
function A01(){
 var c=function(e){return S.ped.filter(function(p){return p.est===e}).length},cr=S.mat.filter(crit);
 var kp=[['📋',c('Pendiente'),'Pedidos pendientes','#e68a00'],['🧵',c('Confección'),'En confección','#1f5fbf'],['✅',c('Terminado'),'Terminados','#2e8b2e'],['⚠️',cr.length,'Insumos críticos','#c62828']].map(function(k){return '<div class="kp" style="background:linear-gradient(135deg,'+k[3]+','+k[3]+'aa)"><span>'+k[0]+'</span><b>'+k[1]+'</b><small>'+k[2]+'</small></div>'}).join('');
 var f=new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'});
 var ul=S.ped.slice(-3).reverse().map(function(p){return '<div class="li">'+G(kOf(p.pre))+'<div><b>'+p.cli+'</b><br><small>'+p.pre+'</small></div><span class="b '+p.est+'">'+lb(p.est)+'</span></div>'}).join('');
 var al=cr.length?cr.map(function(m){return '<div class="li">'+sw(m.c)+'<div><b>'+m.n+'</b><br><small>'+m.q+' '+m.u+' · mínimo '+m.min+'</small></div><span class="b Crítico">Crítico</span></div>'}).join(''):'<p class="rf">Sin alertas</p>';
 return '<div class="hero"><img class="lgi" style="height:84px" src="'+LOGO+'" alt=""><div><h2>¡Bienvenido, Dueño!</h2><p>'+f+'</p></div><div class="hb"><button class="btn" onclick="S.nf=true;go(\'A03\')"'+dis()+'>+ Nuevo pedido</button><button class="btn o" onclick="go(\'A03\')"'+dis()+'>Ver pedidos</button><button class="btn o" onclick="go(\'A04\')"'+dis()+'>Inventario</button></div></div>'+
 '<div class="cards">'+kp+'</div><div class="gr2"><div><div class="ttl">Últimos pedidos</div>'+ul+'</div><div><div class="ttl">Alertas de stock</div>'+al+'</div></div>';
}
function estP(x){return x.tipo==='Encargo'?['Por encargo','Aprobada']:x.q===0?['Agotado','Crítico']:x.q<=5?['Stock bajo','Pendiente']:['Disponible','OK']}
function A02(){
 var g=S.pre.map(function(x,i){var e=estP(x);
  var bt=x.tipo==='Encargo'?'<span class="rf">Confección según medidas</span>':'<button class="btn" onclick="vend('+i+')"'+(mode==='st'||x.q===0?' disabled':'')+'>Registrar venta (−1)</button>';
  return '<div class="pc"><div class="im">'+G(kOf(x.n))+'</div><div class="in"><b>'+x.n+'</b><br><small>'+x.cat+' · S/ '+x.pr+'</small><p style="margin:6px 0"><span class="b '+e[1]+'">'+e[0]+'</span> <small>Stock: '+(x.q===null?'-':x.q)+'</small></p>'+bt+'</div></div>'}).join('');
 return '<div class="gr">'+g+'</div><p class="note">El estado cambia solo según el stock registrado: 0 = Agotado, 1 a 5 = Stock bajo.</p>';
}
function vend(i){var x=S.pre[i];if(x.q>0)x.q--;render();toast(x.n+': stock '+x.q)}
function nuevoPed(){
 var d=dis(),op=mode==='st'||S.nf;
 var btn='<div style="margin-bottom:10px"><button class="btn" onclick="S.nf=!S.nf;render()"'+d+'>'+(S.nf&&mode!=='st'?'Cerrar formulario':'+ Nuevo pedido')+'</button></div>';
 if(!op)return btn;
 var opt=S.pre.map(function(x,i){return '<option value="'+i+'">'+x.n+' · S/ '+x.pr+(x.tipo==='Encargo'?' (por encargo)':'')+'</option>'}).join('');
 return btn+'<div class="pc" style="padding:12px;margin-bottom:12px"><div class="ttl" style="margin-top:0">Registrar nuevo pedido</div><div class="frm"><input id="pc" placeholder="Cliente (nombre o DNI/RUC)" style="width:230px"'+d+'><select id="pp"'+d+'>'+opt+'</select><input id="pq" type="number" min="1" placeholder="Cantidad" style="width:100px"'+d+'><input id="pf" type="date"'+d+'></div><div class="frm"><input id="ps" placeholder="Especificaciones (logo, bordado, medidas)" style="flex:1;min-width:220px"'+d+'><input id="po" placeholder="Cód. de operación (opcional)" style="width:210px"'+d+'></div><button class="btn" onclick="savePed()"'+d+'>Guardar pedido</button></div>';
}
function savePed(){
 var c=document.getElementById('pc').value.trim(),x=S.pre[document.getElementById('pp').value],q=parseInt(document.getElementById('pq').value,10),o=document.getElementById('po').value.trim();
 if(!c){toast('Ingrese el cliente');return}
 if(!(q>0)){toast('Ingrese una cantidad válida');return}
 if(x.tipo==='Stock'&&q>x.q){toast('Stock insuficiente: solo hay '+x.q+' de '+x.n);return}
 var id='P-'+String(S.ped.length+1).padStart(5,'0');
 S.ped.push({id:id,cli:c,pre:x.n+' x'+q,est:'Pendiente'});
 if(x.tipo==='Stock')x.q-=q;
 if(o)S.pag.push({p:id,m:x.pr*q,op:o,e:'Verificación'});
 S.nf=false;render();
 var l=document.querySelectorAll('.oc');if(l.length)l[l.length-1].scrollIntoView({behavior:'smooth',block:'center'});
 toast(id+' registrado en estado Pendiente'+(o?'':' · falta registrar el pago'))}
function A03(){
 var r=S.ped.map(function(p,i){var nx=NEXT[p.est],pa=pago(p.id);
  var bt=nx?'<button class="btn" onclick="adv('+i+')"'+dis()+'>Pasar a '+lb(nx)+'</button>':'<span class="rf">Finalizado</span>';
  return '<div class="oc">'+G(kOf(p.pre))+'<div class="inf"><b>'+p.id+' · '+p.cli+'</b><br><small>'+p.pre+'</small>'+stp(p.est)+'</div><div><span class="b '+p.est+'">'+lb(p.est)+'</span><br><small>Pago: '+(pa?pa.e:'—')+'</small></div>'+bt+'</div>'}).join('');
 return nuevoPed()+r+'<p class="note">Regla de control: un pedido pendiente solo pasa a confección si su pago fue validado (ver Pagos) y respeta la secuencia Pendiente → En Confección → Terminado → Entregado.</p>';
}
function A04(){
 var cr=S.mat.filter(crit);
 var al=cr.length?'<div class="alert"><span><b>Stock crítico:</b> '+cr.map(function(m){return m.n}).join(', ')+'</span><button class="btn r" onclick="sol()"'+dis()+'>Generar solicitud de compra</button></div>':'';
 var g=S.mat.map(function(m){var pc=Math.min(100,m.q/(m.min*2)*100);
  return '<div class="pc"><div class="li" style="padding:10px;border:0">'+sw(m.c)+'<div><b>'+m.n+'</b><br><small>'+m.c+'</small></div></div><div class="in"><div class="pb"><i class="'+(crit(m)?'c':'')+'" style="width:'+pc+'%"></i></div><p style="margin:6px 0"><b>'+m.q+'</b> '+m.u+' <small>/ mín. '+m.min+'</small> <span class="b '+(crit(m)?'Crítico':'OK')+'">'+(crit(m)?'Stock Crítico':'Normal')+'</span></p></div></div>'}).join('');
 var opt=S.mat.map(function(m){return '<option value="'+m.c+'">'+m.n+'</option>'}).join('');
 return al+'<div class="gr">'+g+'</div>'+
 '<div class="ttl">Registrar movimiento</div><div class="frm"><select id="fm"'+dis()+'>'+opt+'</select><select id="ft"'+dis()+'><option value="e">Entrada</option><option value="s">Salida</option></select>'+
 '<input id="fq" type="number" min="1" placeholder="Cantidad" style="width:110px"'+dis()+'><button class="btn" onclick="mov()"'+dis()+'>Registrar movimiento</button></div>'+
 '<p class="note">Validaciones: cantidad positiva y salida no mayor al stock disponible. Lo que baja del mínimo se marca en rojo automáticamente.</p>';
}
function A05(){
 if(!S.com.length)return '<p class="rf">No hay solicitudes. Se generan desde Inventario (A04) cuando hay stock crítico.</p>';
 var r=S.com.map(function(c,i){
  var bt=c.e==='Solicitada'?'<button class="btn" onclick="cm('+i+',1)"'+dis()+'>Aprobar (Marco Antonio Rojas Hurtado)</button>':
         c.e==='Aprobada'?'<button class="btn" onclick="cm('+i+',2)"'+dis()+'>Registrar recepción (Apellido y nombres)</button>':'<span class="rf">Cerrada</span>';
  return '<tr><td>SC-'+String(i+1).padStart(3,'0')+'</td><td>'+c.n+'</td><td>'+c.q+' '+c.u+'</td><td><span class="b '+c.e+'">'+c.e+'</span></td><td>'+bt+'</td></tr>';
 }).join('');
 return '<div class="tw"><table><tr><th>N.°</th><th>Material</th><th>Cantidad</th><th>Estado</th><th>Acción</th></tr>'+r+'</table></div>'+
 '<p class="note">Al registrar la recepción, el stock se actualiza automáticamente en Inventario.</p>';
}
function A06(){
 var r=S.pag.map(function(x,i){var pe=S.ped.filter(function(p){return p.id===x.p})[0];
  var bt=x.e==='Verificación'?'<div><button class="btn" onclick="pg('+i+',1)"'+dis()+'>Validar</button> <button class="btn r" onclick="pg('+i+',0)"'+dis()+'>Rechazar</button></div>':'';
  return '<div class="oc">'+R(x.m,x.op)+'<div class="inf"><b>'+x.p+'</b> · '+(pe?pe.cli:'')+'<br><small>'+(pe?pe.pre:'')+'</small><br><span class="b '+x.e+'">'+x.e+'</span> <small>Op. '+x.op+' · S/ '+x.m+'</small></div>'+bt+'</div>'}).join('');
 return r+'<p class="note">Sin pasarela en línea (fuera del alcance): el cliente informa su operación Yape/Plin y el Vendedor la valida manualmente.</p>';
}
var PERM={Dueño:[1,1,1,1,1,1],Vendedor:[1,1,0,1,0,0],Almacén:[0,1,1,0,0,0]};
function A08(){
 var col={Dueño:'#c9a24a',Vendedor:'#1f5fbf',Almacén:'#2e8b2e'},d=dis();
 var cards=S.usr.map(function(u,i){var ini=u.n.split(' ').map(function(w){return w[0]}).slice(0,2).join('');
  return '<div class="oc"><div class="av" style="background:'+col[u.r]+'">'+ini+'</div><div class="inf"><b>'+u.n+'</b><br><small>'+u.c+'</small></div><span class="b" style="background:'+col[u.r]+'">'+u.r+'</span><span class="b '+(u.a?'OK':'Crítico')+'">'+(u.a?'Activo':'Inactivo')+'</span><button class="btn o" onclick="tgU('+i+')"'+d+'>'+(u.a?'Desactivar':'Activar')+'</button></div>'}).join('');
 var md=['Pedidos','Inventario','Compras','Pagos','Reportes','Usuarios'];
 var pm=Object.keys(PERM).map(function(r){return '<tr><td><b>'+r+'</b></td>'+PERM[r].map(function(v){return '<td>'+(v?'✔':'—')+'</td>'}).join('')+'</tr>'}).join('');
 return '<div class="ttl" style="margin-top:0">Usuarios del sistema</div>'+cards+
 '<div class="ttl">Nuevo usuario</div><div class="frm"><input id="un" placeholder="Apellido y nombres" style="width:220px"'+d+'><input id="uc" type="email" placeholder="Correo" style="width:210px"'+d+'><select id="ur"'+d+'><option>Vendedor</option><option>Almacén</option><option>Dueño</option></select><input id="up" type="password" placeholder="Contraseña (mín. 6)" style="width:170px"'+d+'><button class="btn" onclick="addU()"'+d+'>Crear usuario</button></div>'+
 '<div class="ttl">Permisos por rol</div><div class="tw"><table><tr><th>Rol</th>'+md.map(function(m){return '<th>'+m+'</th>'}).join('')+'</tr>'+pm+'</table></div>'+
 '';
}
function tgU(i){var u=S.usr[i];if(u.r==='Dueño'){toast('No se puede desactivar al Dueño');return}u.a=!u.a;render();toast(u.n+(u.a?' activado':' desactivado'))}
function addU(){var n=document.getElementById('un').value.trim(),c=document.getElementById('uc').value.trim().toLowerCase(),r=document.getElementById('ur').value,p=document.getElementById('up').value;
 if(!n){toast('Ingrese el nombre');return}
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)){toast('Correo no válido');return}
 if(S.usr.some(function(u){return u.c===c})){toast('Ese correo ya está registrado');return}
 if(p.length<6){toast('La contraseña debe tener al menos 6 caracteres');return}
 S.usr.push({n:n,c:c,r:r,a:true});render();toast('Usuario creado como '+r+'. Contraseña guardada encriptada')}
function A07(){
 var est=['Pendiente','Confección','Terminado','Entregado'];
 var mx=Math.max.apply(null,S.mat.map(function(m){return m.min}))||1;
 var b1=est.map(function(e){var n=S.ped.filter(function(p){return p.est===e}).length;
  return '<div class="r"><span class="l">'+lb(e)+'</span><span class="t"><span class="f" style="display:block;width:'+(n/S.ped.length*100)+'%"></span></span><b>'+n+'</b></div>'}).join('');
 var b2=S.mat.map(function(m){
  return '<div class="r"><span class="l">'+m.n+'</span><span class="t"><span class="f'+(crit(m)?' c':'')+'" style="display:block;width:'+Math.min(100,m.q/mx*100)+'%"></span></span><b>'+m.q+'/'+m.min+'</b></div>'}).join('');
 return '<div class="bars"><b>Pedidos por estado</b>'+b1+'<br><b>Existencias vs. stock mínimo</b>'+b2+'</div>';
}
var V={A01:A01,A02:A02,A03:A03,A04:A04,A05:A05,A06:A06,A07:A07,A08:A08};
var META={A02:'RF-04',A01:'RF-03, RF-05',A03:'RF-02, RF-03, RF-06',A04:'RF-04, RF-05',A05:'RF-07',A06:'Validación manual de pagos',A07:'Módulo de reportes'};
var DESC={A08:'Administra a quienes usan el sistema: crea usuarios con su rol (Dueño, Vendedor o Almacén), los activa o desactiva y muestra a qué módulos accede cada rol.',A02:'Lista las prendas con categoría, tipo, precio y stock. El estado (Disponible, Stock bajo, Agotado, Por encargo) cambia solo según el stock registrado.',A01:'Pantalla de inicio del personal. Resume en tarjetas los pedidos pendientes, en confección y terminados, y avisa cuántos insumos están en stock crítico.',A03:'Lista los pedidos con cliente, detalle y estado. Cada pedido tiene un botón para pasar al siguiente estado: Pendiente, En Confección, Terminado y Entregado.',A04:'Controla telas, hilos y accesorios. Muestra cantidad, unidad y stock mínimo, resalta en rojo lo que está bajo el mínimo y permite registrar entradas y salidas.',A05:'Registra las solicitudes de compra de materiales faltantes. El dueño, Marco Antonio Rojas Hurtado, las aprueba y, al llegar el insumo, la recepción la registra Apellido y nombres.',A06:'El Vendedor revisa el código de operación y el monto informados por el cliente, y valida o rechaza el pago.',A07:'Resume los pedidos por estado y compara las existencias de cada material con su stock mínimo.'};

function render(){
 var t=SC.filter(function(s){return s[0]===cur})[0];
 document.getElementById('scr').innerHTML=chrome()+'<div class="box'+(mode==='st'?' st wf':' mod')+'"><div class="top"><span><b>'+t[1]+'</b></span></div>'+V[cur]()+'</div>';
}
function chrome(){
 var G={INICIO:'A01',PRENDAS:'A02',PEDIDOS:'A03',INVENTARIO:'A04',COMPRAS:'A05',PAGOS:'A06',REPORTES:'A07',USUARIOS:'A08'};
 var M={A08:'USUARIOS',A02:'PRENDAS',A01:'INICIO',A03:'PEDIDOS',A04:'INVENTARIO',A05:'COMPRAS',A06:'PAGOS',A07:'REPORTES'};
 var slug={A08:'usuarios',A02:'prendas',A01:'inicio',A03:'pedidos',A04:'inventario',A05:'compras',A06:'pagos',A07:'reportes'}[cur];
 var items=['INICIO','USUARIOS','PRENDAS','INVENTARIO','PEDIDOS','PAGOS','COMPRAS','REPORTES'].map(function(x){return '<span'+(x===M[cur]?' class="on"':'')+(G[x]?' onclick="go(\''+G[x]+'\')"':'')+'>'+x+'</span>'}).join('');
 return '<div class="chrome '+(mode==='st'?'wf':'mod')+'"><div class="tabn">PANEL DEL ADMINISTRADOR · '+M[cur]+'</div><div class="url"><span>← → ⟳</span><span class="u">https://www.kismac.pe/admin/'+slug+'</span></div><div class="hd"><img class="lgi" src="'+LOGO+'" alt="KISMAC"><span>Marco Antonio Rojas Hurtado<br><small>Cargo: Dueño</small></span><span class="sal">Salir</span></div><div class="mn">'+items+'</div></div>';
}
function go(a){cur=a;render()}
function adv(i){var p=S.ped[i],g=pago(p.id);
 if(p.est==='Pendiente'&&(!g||g.e!=='Validado')){toast('No se puede avanzar: el pago aún no está validado (A06)');return}
 p.est=NEXT[p.est];render();toast(p.id+' → '+lb(p.est))}
function mov(){var c=document.getElementById('fm').value,t=document.getElementById('ft').value,q=parseInt(document.getElementById('fq').value,10);
 if(!(q>0)){toast('Ingrese una cantidad positiva');return}
 var m=S.mat.filter(function(x){return x.c===c})[0];
 if(t==='s'&&q>m.q){toast('Salida mayor al stock disponible ('+m.q+' '+m.u+')');return}
 m.q+=t==='e'?q:-q;render();toast('Movimiento registrado: '+m.n+' = '+m.q+' '+m.u)}
function sol(){var n=0;S.mat.filter(crit).forEach(function(m){
 if(S.com.some(function(c){return c.c===m.c&&c.e!=='Recibida'}))return;
 S.com.push({c:m.c,n:m.n,u:m.u,q:m.min*2-m.q,e:'Solicitada'});n++});
 render();toast(n?n+' solicitud(es) de compra registradas (ver Compras)':'Ya existen solicitudes abiertas')}
function cm(i,s){var c=S.com[i];
 if(s===1){c.e='Aprobada';toast('Solicitud aprobada')}
 else{c.e='Recibida';S.mat.filter(function(m){return m.c===c.c})[0].q+=c.q;toast('Recepción registrada: stock actualizado')}
 render()}
function pg(i,ok){S.pag[i].e=ok?'Validado':'Rechazado';render();toast(ok?'Pago validado':'Pago rechazado')}
render();
</script>
</body>
